name: Fetch cities

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/fetch_cities.py
      - .github/workflows/fetch-cities.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify
        run: python3 tools/fetch_cities.py
      - name: Commit
        run: |
          git add FiveSkies/Resources/Cities
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "five-skies-ci"
          git config user.email "ci@users.noreply.github.com"
          git commit -m "Fetch GeoNames city list (cities15000, four columns)"
          git pull --rebase origin main
          git push origin HEAD:main
