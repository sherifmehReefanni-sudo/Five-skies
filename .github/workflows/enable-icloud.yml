name: Enable iCloud backup

# One-off, run by hand. Turns on the iCloud capability (key-value storage, no CloudKit)
# for app.fiveskies.ios through the App Store Connect API, then makes a signed Release
# archive to prove the new entitlement signs. Nothing is uploaded.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Python packages
        run: pip install --quiet pyjwt cryptography requests
      - name: Turn on iCloud for the App ID
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -e
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$ASC_KEY_P8_BASE64" | tr -d ' \r\n\t' | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          ASC_KEY_PATH="$KEY_PATH" python3 tools/asc_enable_icloud.py
          rm -f "$KEY_PATH"

  signed-archive-check:
    needs: capability
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode 26 or later
        run: |
          XCODE=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -n 1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Archive (Release, signed, not uploaded)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          mkdir -p "$HOME/private_keys"
          KEY_PATH="$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_P8_BASE64" | tr -d ' \r\n\t' | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          xcodebuild archive \
            -project FiveSkies.xcodeproj \
            -scheme FiveSkies \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/FiveSkies.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -n 40
          rm -f "$KEY_PATH"
      - name: Show the signed entitlements
        run: |
          APP=$(ls -d "$RUNNER_TEMP"/FiveSkies.xcarchive/Products/Applications/*.app | head -n 1)
          codesign -d --entitlements :- "$APP" 2>/dev/null | grep -A1 -E "ubiquity-kvstore|application-groups"
