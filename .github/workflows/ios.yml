name: iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    permissions:
      contents: write
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick an iPhone simulator
        id: simulator
        run: |
          xcrun simctl list devices available
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          def version(runtime):
              match = re.search(r"iOS-(\d+)-(\d+)", runtime)
              return tuple(int(part) for part in match.groups()) if match else None
          runtimes = sorted((r for r in devices if version(r) and version(r) >= (17, 0)), key=version, reverse=True)
          for runtime in runtimes:
              for device in devices[runtime]:
                  if device["name"].startswith("iPhone") and device.get("isAvailable", True):
                      print(device["udid"])
                      sys.exit(0)
          sys.exit(1)
          ')
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project FiveSkies.xcodeproj \
            -scheme FiveSkies \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Export screenshots
        if: always()
        run: |
          mkdir -p screenshots
          if [ ! -d TestResults.xcresult ]; then
            echo "No result bundle was produced."
            exit 0
          fi
          if xcrun xcresulttool export attachments --path TestResults.xcresult --output-path screenshots; then
            python3 - <<'PY' || true
          import json, os, shutil
          manifest_path = os.path.join("screenshots", "manifest.json")
          if os.path.exists(manifest_path):
              with open(manifest_path) as handle:
                  manifest = json.load(handle)
              for test in manifest:
                  for item in test.get("attachments", []):
                      exported = item.get("exportedFileName")
                      wanted = item.get("suggestedHumanReadableName")
                      source = os.path.join("screenshots", exported or "")
                      if exported and wanted and os.path.exists(source):
                          shutil.copyfile(source, os.path.join("screenshots", wanted))
          PY
          else
            echo "xcresulttool export attachments is not available; upload the full result bundle instead."
          fi
          ls -la screenshots

      - name: Publish screenshots to the ci-screenshots branch
        if: always()
        env:
          GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(ls -A screenshots 2>/dev/null)" ]; then
            echo "No screenshots to publish."
            exit 0
          fi
          work=$(mktemp -d)
          find screenshots -maxdepth 1 -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' \) | while read -r file; do
            base=$(basename "$file")
            case "$base" in
              *_[0-9]_[0-9A-F]*-*) continue ;;
            esac
            cp "$file" "$work/$base"
          done
          if [ -z "$(ls -A "$work")" ]; then
            cp screenshots/*.png "$work"/ 2>/dev/null || true
          fi
          for image in "$work"/*; do
            sips -Z 1300 "$image" >/dev/null 2>&1 || true
          done
          echo "$GITHUB_SHA" > "$work/COMMIT.txt"
          cd "$work"
          git init -q -b ci-screenshots
          git add -A
          git -c user.name="five-skies-ci" -c user.email="ci@users.noreply.github.com" commit -q -m "Screenshots for $GITHUB_SHA"
          git push -f "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots || echo "Could not publish screenshots."

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: warn

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults.xcresult
          path: TestResults.xcresult
          if-no-files-found: warn
