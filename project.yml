name: FiveSkies

options:
  bundleIdPrefix: app.fiveskies
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  Adhan:
    url: https://github.com/batoulapps/adhan-swift
    from: 1.4.0

targets:
  FiveSkies:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FiveSkies
    dependencies:
      - package: Adhan
        product: Adhan
      - target: FiveSkiesWidgets
        embed: true
    info:
      path: SupportFiles/FiveSkies-Info.plist
      properties:
        CFBundleDisplayName: Five Skies
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        NSPhotoLibraryAddUsageDescription: Five Skies saves the wallpapers and ayah cards you choose to your photo library.
        NSLocationWhenInUseUsageDescription: Your location is used on this device to calculate prayer times and the Qibla direction. It is never sent anywhere.
        UIAppFonts:
          - AmiriQuran.ttf
        UILaunchScreen:
          UIImageRespectsSafeAreaInsets: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.fiveskies.ios
        PRODUCT_NAME: FiveSkies
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
        Release:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_ENTITLEMENTS: FiveSkies/WidgetSupport/FiveSkies.entitlements

  FiveSkiesWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FiveSkiesWidgets
      - path: FiveSkies/WidgetSupport/SharedPrayerConfig.swift
      - path: FiveSkies/WidgetSupport/PrayerWidgetTimeline.swift
      - path: FiveSkies/WidgetSupport/WidgetViews.swift
      - path: FiveSkies/Prayer/PrayerDay.swift
      - path: FiveSkies/Prayer/PrayerTimesService.swift
      - path: FiveSkies/Location/Coordinate.swift
      - path: FiveSkies/Location/Place.swift
      - path: FiveSkies/Settings/AppSettings.swift
      - path: FiveSkies/Settings/SettingsAdhanMapping.swift
      - path: FiveSkies/Today/SkyStyle.swift
      - path: FiveSkies/Today/SkylineShapes.swift
      - path: FiveSkies/Today/TileTimeFormat.swift
      - path: FiveSkies/Today/Color+Hex.swift
    dependencies:
      - package: Adhan
        product: Adhan
    info:
      path: SupportFiles/FiveSkiesWidgets-Info.plist
      properties:
        CFBundleDisplayName: Five Skies
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.fiveskies.ios.widgets
        PRODUCT_NAME: FiveSkiesWidgets
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_ENTITLEMENTS: FiveSkiesWidgets/FiveSkiesWidgets.entitlements

  FiveSkiesTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FiveSkiesTests
    dependencies:
      - target: FiveSkies
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.fiveskies.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"

  FiveSkiesUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FiveSkiesUITests
    dependencies:
      - target: FiveSkies
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.fiveskies.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  FiveSkies:
    build:
      targets:
        FiveSkies: all
        FiveSkiesTests: [test]
        FiveSkiesUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FiveSkiesTests
        - FiveSkiesUITests
    archive:
      config: Release
