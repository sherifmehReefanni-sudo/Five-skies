name: FiveSkies

options:
  bundleIdPrefix: app.fiveskies
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  Adhan:
    url: https://github.com/batoulapps/adhan-swift
    from: 1.4.0

targets:
  FiveSkies:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FiveSkies
    dependencies:
      - package: Adhan
        product: Adhan
    info:
      path: SupportFiles/FiveSkies-Info.plist
      properties:
        CFBundleDisplayName: Five Skies
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        NSLocationWhenInUseUsageDescription: Your location is used on this device to calculate prayer times and the Qibla direction. It is never sent anywhere.
        UILaunchScreen:
          UIImageRespectsSafeAreaInsets: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.fiveskies.ios
        PRODUCT_NAME: FiveSkies
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Debug:
          ENABLE_TESTABILITY: YES

  FiveSkiesTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FiveSkiesTests
    dependencies:
      - target: FiveSkies
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.fiveskies.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"

  FiveSkiesUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FiveSkiesUITests
    dependencies:
      - target: FiveSkies
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.fiveskies.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  FiveSkies:
    build:
      targets:
        FiveSkies: all
        FiveSkiesTests: [test]
        FiveSkiesUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FiveSkiesTests
        - FiveSkiesUITests
    archive:
      config: Release
